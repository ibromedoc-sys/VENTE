name: Build VENTE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<70" wheel
          python -m pip install "Cython==3.0.12"
          python -m pip install "buildozer==1.5.0"

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .buildozer/android/packages
          key: p4a-downloads-v6-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            p4a-downloads-v6-${{ runner.os }}-

      - name: Check Cython
        run: |
          cython --version
          python -c "import Cython; print(Cython.__version__)"

      - name: Check FreeType archive
        run: |
          test -f vendor/freetype-2.14.1.tar.gz
          ls -lh vendor/freetype-2.14.1.tar.gz

      - name: Prepare python-for-android
        run: |
          mkdir -p .buildozer/android/platform
          git clone \
            --depth 1 \
            --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git \
            .buildozer/android/platform/python-for-android

      - name: Extract local FreeType source
        run: |
          FREETYPE_DIR="$RUNNER_TEMP/freetype-2.14.1"
          mkdir -p "$FREETYPE_DIR"

          tar -xzf \
            "$GITHUB_WORKSPACE/vendor/freetype-2.14.1.tar.gz" \
            --strip-components=1 \
            -C "$FREETYPE_DIR"

          test -f "$FREETYPE_DIR/configure"
          echo "P4A_FREETYPE_DIR=$FREETYPE_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VENTE-APK
          path: bin/*.apk
          if-no-files-found: error