name: Build SUPERLIFE TOGO signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "setuptools<70"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "kivy==2.3.0" "kivymd==2.0.0"
       

      - name: Clean previous build artifacts
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Verify Cython
        run: |
          cython --version
          python -c "import Cython; print(Cython.__version__)"

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/vente-upload.keystore"
          test -s "$RUNNER_TEMP/vente-upload.keystore"
          chmod 600 "$RUNNER_TEMP/vente-upload.keystore"

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/vente-upload.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: buildozer -v android release

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner="$(find "$HOME/.buildozer/android/platform/android-sdk" \
            -type f -name apksigner -print -quit)"
          test -x "$apksigner"
          shopt -s nullglob
          apks=(bin/*-release.apk)
          test "${#apks[@]}" -eq 1
          "$apksigner" verify --verbose "${apks[0]}"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: SUPERLIFE-TOGO-Release-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/vente-upload.keystore"