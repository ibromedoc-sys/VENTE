name: Build VENTE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "setuptools<70"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "kivy==2.3.0" "kivymd==2.0.0"
       

      - name: Clean everything
        run: |
          rm -rf .buildozer
          rm -rf bin

    
      - name: Vérifier Cython
        run: |
          cython --version
          python -c "import Cython; print(Cython.__version__)"

      - name: Prepare patched CPython 3.12.10 source
        run: |
          set -euo pipefail
          cpython_dir="$RUNNER_TEMP/cpython-3.12.10"
          mkdir -p "$cpython_dir"
          curl -fsSL https://www.python.org/ftp/python/3.12.10/Python-3.12.10.tgz \
            | tar -xz --strip-components=1 -C "$cpython_dir"
          curl -fsSL https://github.com/python/cpython/pull/114876.patch \
            -o "$RUNNER_TEMP/cpython-grp-getgrent.patch"
          patch --dry-run --fuzz=0 -p1 -d "$cpython_dir" \
            < "$RUNNER_TEMP/cpython-grp-getgrent.patch"
          patch --fuzz=0 -p1 -d "$cpython_dir" \
            < "$RUNNER_TEMP/cpython-grp-getgrent.patch"
          grep -q 'ac_cv_func_getgrent' "$cpython_dir/configure.ac"
          grep -q 'HAVE_GETGRENT' "$cpython_dir/pyconfig.h.in"

      - name: Build APK
        env:
          P4A_python3_DIR: ${{ runner.temp }}/cpython-3.12.10
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VENTE-APK
          path: bin/*.apk
          if-no-files-found: error