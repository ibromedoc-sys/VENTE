name: Build VENTE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<70" wheel
          python -m pip install "Cython==3.0.12"
          python -m pip install "buildozer==1.5.0"

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .buildozer/android/packages
          key: p4a-downloads-v5-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            p4a-downloads-v5-${{ runner.os }}-

      - name: Check Cython
        run: |
          cython --version
          python -c "import Cython; print(Cython.__version__)"

      - name: Check FreeType archive
        run: |
          test -f vendor/freetype-2.14.1.tar.gz
          ls -lh vendor/freetype-2.14.1.tar.gz

      - name: Prepare python-for-android
        run: |
          mkdir -p .buildozer/android/platform
          git clone \
            --depth 1 \
            --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git \
            .buildozer/android/platform/python-for-android

      - name: Configure local FreeType archive
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          recipe = (
              workspace
              / ".buildozer"
              / "android"
              / "platform"
              / "python-for-android"
              / "pythonforandroid"
              / "recipes"
              / "freetype"
              / "__init__.py"
          )
          archive = workspace / "vendor" / "freetype-2.14.1.tar.gz"

          if not archive.is_file():
              raise SystemExit(f"Archive FreeType introuvable : {archive}")

          source = recipe.read_text(encoding="utf-8")

          expected_version = "version = '2.14.1'"
          old_url = (
              "https://download.savannah.gnu.org/releases/"
              "freetype/freetype-{version}.tar.gz"
          )

          if source.count(expected_version) != 1:
              raise SystemExit(
                  f"La recette FreeType n'est pas dans la version attendue "
                  f"2.14.1 : {recipe}"
              )

          if source.count(old_url) != 1:
              raise SystemExit(
                  f"URL FreeType attendue une fois dans {recipe}, "
                  f"mais trouvée {source.count(old_url)} fois."
              )

          local_archive_url = archive.as_uri()
          source = source.replace(old_url, local_archive_url)

          recipe.write_text(source, encoding="utf-8")

          print(f"Version FreeType vérifiée : {expected_version}")
          print(f"Archive FreeType utilisée : {local_archive_url}")
          PY

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VENTE-APK
          path: bin/*.apk
          if-no-files-found: error