name: Build VENTE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==3.0.12" "setuptools<70"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "kivy==2.3.0" "kivymd==2.0.0"

      - name: Clean everything
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Cache python-for-android downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.buildozer/android/packages
          key: p4a-downloads-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            p4a-downloads-v2-${{ runner.os }}-

      - name: Vérifier Cython
        run: |
          cython --version
          python -c "import Cython; print(Cython.__version__)"

      - name: Préparer FreeType local
        run: |
          test -f vendor/freetype-2.14.1.tar.gz
          ls -lh vendor/freetype-2.14.1.tar.gz

      - name: Préparer python-for-android
        run: |
          mkdir -p .buildozer/android/platform
          if [ ! -d .buildozer/android/platform/python-for-android ]; then
            git clone https://github.com/kivy/python-for-android.git \
              .buildozer/android/platform/python-for-android
          fi

          cd .buildozer/android/platform/python-for-android
          git checkout v2026.05.09

      - name: Patch recette FreeType
        run: |
          RECIPE=".buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py"

          echo "=== Recette FreeType avant patch ==="
          grep -n "version\|url" "$RECIPE"

          sed -i "s/version = '2.10.1'/version = '2.14.1'/" "$RECIPE"

          sed -i "s#https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz#file:///home/runner/work/VENTE/VENTE/vendor/freetype-2.14.1.tar.gz#" "$RECIPE"

          echo "=== Recette FreeType après patch ==="
          grep -n "version\|url" "$RECIPE"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VENTE-APK
          path: bin/*.apk
          if-no-files-found: error