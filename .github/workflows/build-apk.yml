name: Build VENTE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "setuptools<70"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "kivy==2.3.0" "kivymd==2.0.0"

      - name: Clean everything
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Cache python-for-android downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.buildozer/android/packages
          key: p4a-downloads-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            p4a-downloads-v2-${{ runner.os }}-

      - name: Vérifier Cython
        run: |
          cython --version
          python -c "import Cython; print(Cython.__version__)"

      - name: Préparer FreeType local
        run: |
          mkdir -p ~/.buildozer/android/packages
          cp vendor/freetype-2.14.1.tar.gz ~/.buildozer/android/packages/freetype-2.14.1.tar.gz
          ls -lh ~/.buildozer/android/packages/freetype-2.14.1.tar.gz

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VENTE-APK
          path: bin/*.apk
          if-no-files-found: error